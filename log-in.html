<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    <link rel="stylesheet" href="css/log-in.css">
</head>

<body>
    <div class="window">
        <form action="">
            <h1>Вход</h1>
            <div class="input-box">
                <input id="login" placeholder="Логин / E-mail" required>
            </div>
            <div class="input-box">
                <input id="password" placeholder="Пароль" required>
            </div>
            <div class="remember">
                <label for=""> <input type="checkbox">Запомнить меня</label>
                <a href="#" id="forgot-link">Забыли пароль?</a>
            </div>
            <button type="button" class="btn">Войти</button>
            <div class="reg-link">
                <p>Нет аккаунта? <a href="index.html">Регистрация</p>
      </div>
    </form>
  </div>
</body>
<script src="js/log-in.js"></script>
</html>
